name: Release

# Push a tag like v1.0.1 to build, test and publish a GitHub release with the installer and a portable zip.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: v
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || v="0.0.0"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Logic checks
        run: dotnet run --project NetMeter.Tests -c Release

      - name: Publish
        run: dotnet publish NetMeter -c Release -r win-x64 --self-contained -p:Version=${{ steps.v.outputs.version }} -p:DebugType=None -o publish

      - name: Installer
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.v.outputs.version }} installer\NetMeter.iss

      - name: Portable zip
        run: Compress-Archive -Path publish\* -DestinationPath dist\NetMeter-${{ steps.v.outputs.version }}-portable.zip

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "NetMeter $GITHUB_REF_NAME" --generate-notes
